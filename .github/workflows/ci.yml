name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml: stable, with the wasm32-wasip1 target
      - run: rustup show && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release --workspace -- -D warnings
      - run: cargo test -p common --target x86_64-unknown-linux-gnu
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            target/wasm32-wasip1/release/*.wasm
            claude/hook.sh

  # A v* tag publishes the plugins, the hook of the claude plugin and their
  # SHA256 in a release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugins
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp target/wasm32-wasip1/release/{bar,claude,git}.wasm dist/
          cp claude/hook.sh dist/claude-hook.sh
          cd dist
          sha256sum * > sha256sums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes ./*
