[workspace]
resolver = "2"
members = ["bar", "claude", "common"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/plivox/zellij-plugins"

[workspace.dependencies]
zellij-tile = "=0.45.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
